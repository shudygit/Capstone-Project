# Full hybrid on NON-IID (Dirichlet) data - used for the non-IID robustness study.
# Under heterogeneous clients the z-score filter can wrongly flag honest clients;
# scripts/sweep_noniid.py sweeps the Dirichlet alpha and the filter tau to measure
# how the false-positive rate behaves and where a safe operating point lies.
experiment:
  name: noniid_hybrid
  seed: 0
  results_dir: ./results

data:
  dataset: mnist
  data_root: ./data
  num_clients: 10
  partition: dirichlet     # non-IID
  dirichlet_alpha: 0.1     # smaller = more heterogeneous
  batch_size: 64
  test_batch_size: 1000

model:
  name: small_cnn

federated:
  num_rounds: 30
  local_epochs: 1
  lr: 0.01
  momentum: 0.9
  client_fraction: 1.0
  device: auto

attack:
  enabled: true
  types: [label_flip, gradient_noise]
  malicious_fraction: 0.3
  label_flip_source: 7
  label_flip_target: 1
  noise_sigma: 0.8

blockchain:
  enabled: false           # not relevant to the filter's false-positive behaviour

defense:
  enabled: true
  z_threshold: 2.5
  fraction_threshold: 0.05
